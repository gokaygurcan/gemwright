# npm trusted publisher: gokaygurcan/gemwright, release.yml, environment npm; allow npm publish.
name: Release to npm

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'gokaygurcan/gemwright'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.package.outputs.dist-tag }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check source
        run: |
          bunx --no-install biome format src
          bun run typecheck
          bun test
          bun run build

      - name: Pack and validate release
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, mkdirSync, readFileSync, renameSync } from 'node:fs';
          import { join } from 'node:path';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'gemwright');
          assert.equal(pkg.repository.url, 'git+https://github.com/gokaygurcan/gemwright.git');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG?.replace(/^v/, ''), pkg.version, 'Release tag must match package.json (optional v prefix)');
          const prerelease = pkg.version.includes('-');
          assert.equal(process.env.PRERELEASE, String(prerelease), 'GitHub prerelease status must match the version');

          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'pack.json'), 'utf8'));
          const pack = Array.isArray(result) ? result[0] : result[pkg.name];
          assert.equal(pack.version, pkg.version);
          const files = new Set(pack.files.map(file => file.path));
          for (const path of files) {
            assert.ok(/^(LICENSE|README\.md|package\.json|dist\/index\.js|templates\/(servuo|sphere)\/(Dockerfile|[\w-]+\.sh)|patches\/[\w-]+\.patch)$/.test(path), `Unexpected package file: ${path}`);
          }
          for (const path of [pkg.bin.gemwright, 'patches/servuo-pub57-hosting.patch', 'patches/sphere-hosting.patch', ...['servuo', 'sphere'].flatMap(emulator => ['Dockerfile', 'start.sh', 'railway-start.sh'].map(file => `templates/${emulator}/${file}`))])
            assert.ok(files.has(path), `Missing runtime file: ${path}`);

          const directory = join(process.env.RUNNER_TEMP, 'npm-release');
          mkdirSync(directory);
          const tarball = join(directory, 'gemwright.tgz');
          renameSync(join(process.env.RUNNER_TEMP, pack.filename), tarball);
          const sha256 = createHash('sha256').update(readFileSync(tarball)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${prerelease ? 'next' : 'latest'}\nsha256=${sha256}\n`);
          NODE

      - name: Smoke-test packaged CLI
        run: |
          mkdir "$RUNNER_TEMP/npm-smoke"
          tar -xzf "$RUNNER_TEMP/npm-release/gemwright.tgz" -C "$RUNNER_TEMP/npm-smoke"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/npm-smoke/package/node_modules"
          node "$RUNNER_TEMP/npm-smoke/package/dist/index.js" --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-release/gemwright.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@12.2.0 --ignore-scripts --registry=https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
          digest-mismatch: error

      - name: Verify and publish the tested tarball
        working-directory: release
        env:
          TARBALL_SHA256: ${{ needs.verify.outputs.sha256 }}
          NPM_DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          printf '%s  gemwright.tgz\n' "$TARBALL_SHA256" | sha256sum --check
          npm publish ./gemwright.tgz --ignore-scripts --access public --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org
