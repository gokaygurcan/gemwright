# npm trusted publisher: gokaygurcan/gemwright, release.yml, environment npm; allow npm publish.
# Releases with Changesets (https://changesets.dev). On every push to main, after the checks:
# - with pending changesets, open or update the "Release gemwright" pull request, which bumps the
#   version and writes CHANGELOG.md;
# - once that pull request is merged (a version not yet on npm), pack the CLI, validate the
#   tarball, publish it from the npm environment, tag it and create its GitHub release.
# Only the gemwright CLI is published; the other workspace packages are private.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'gokaygurcan/gemwright'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint, typecheck and test
        run: |
          bun run lint
          bun run typecheck
          bun run test

  select-mode:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Select version or publish
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      # The changelog links each entry to its pull request and author (@changesets/changelog-github).
      - name: Open or update the release pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: bun run version-packages
          commit-message: Release gemwright
          pr-title: Release gemwright

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      # npm pack runs the package's prepack script, which builds dist/ and workspace/.
      - name: Pack the CLI
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

      - name: Validate package contents
        working-directory: packages/gemwright
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { globSync, mkdirSync, readFileSync, renameSync, statSync } from 'node:fs';
          import { join } from 'node:path';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'gemwright');
          assert.equal(pkg.repository.url, 'git+https://github.com/gokaygurcan/gemwright.git');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);

          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'pack.json'), 'utf8'));
          const pack = Array.isArray(result) ? result[0] : result[pkg.name];
          assert.equal(pack.version, pkg.version);
          const files = new Set(pack.files.map(file => file.path));
          const expected = new Set(['LICENSE', 'README.md', 'package.json']);
          for (const pattern of pkg.files) {
            const matches = globSync(pattern.endsWith('/') ? [`${pattern}**/*`, `${pattern}**/.*`] : pattern).filter(path => statSync(path).isFile());
            assert.ok(matches.length, `No package files match: ${pattern}`);
            for (const path of matches) expected.add(path);
          }
          assert.deepEqual(files, expected, 'Package contents must match package.json');
          for (const path of [pkg.bin.gemwright, '.github/small-forge.png', 'patches/servuo-pub57-hosting.patch', 'patches/sphere-hosting.patch', ...['servuo', 'sphere'].flatMap(emulator => ['Dockerfile', 'start.sh', 'railway-start.sh'].map(file => `templates/${emulator}/${file}`)), 'workspace/bun.lock', 'workspace/packages/ai/Dockerfile', 'workspace/packages/common/src/huffman.ts', 'workspace/packages/client/Dockerfile', 'workspace/packages/client/runtime/_framework/dotnet.js', 'workspace/packages/client/runtime/licenses/WebClients.txt'])
            assert.ok(files.has(path), `Missing runtime file: ${path}`);

          mkdirSync(join(process.env.RUNNER_TEMP, 'npm-smoke'));
          renameSync(join(process.env.RUNNER_TEMP, pack.filename), join(process.env.RUNNER_TEMP, 'npm-smoke', 'gemwright.tgz'));
          NODE

      - name: Smoke-test the packaged CLI
        run: |
          cd "$RUNNER_TEMP/npm-smoke"
          tar -xzf gemwright.tgz
          ln -s "$GITHUB_WORKSPACE/packages/gemwright/node_modules" package/node_modules
          node package/dist/index.js --help

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@12.2.0 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      # Publishes the tarball packed above, pushes the gemwright@<version> tag and creates the
      # GitHub release from that version's CHANGELOG.md entry.
      - name: Publish to npm and create the GitHub release
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
